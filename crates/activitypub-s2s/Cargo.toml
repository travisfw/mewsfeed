[package]
name = "activitypub-s2s"
version = "0.0.1"
edition = "2021"
description = "ActivityPub S2S protocol types and localhost server for MewsFeed federation"

[lib]
name = "activitypub_s2s"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

# HTTP server + client
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"

# Crypto for HTTP Signatures
rsa = { version = "0.9", features = ["pem"] }
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
rand = "0.8"
pkcs8 = { version = "0.10", features = ["pem"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
thiserror = "2"
url = "2"

# Holochain conductor client (optional, for ZomeDataSource)
holochain_client = { version = "0.8", optional = true }
holochain_zome_types = { version = "0.6", optional = true }
holo_hash = { version = "0.6", optional = true }

[features]
default = []
zome = ["dep:holochain_client", "dep:holochain_zome_types", "dep:holo_hash"]

[dev-dependencies]
holochain = { version = "0.6", features = ["sweettest"] }
holochain_types = "0.6"
